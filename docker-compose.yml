services:
  db:
    image: mariadb:latest
    container_name: headless-wp-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-wordpress}
      MARIADB_USER: ${MARIADB_USER:-wordpress}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set_MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set_MARIADB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    command:
      - --max_allowed_packet=256M
      - --innodb_buffer_pool_size=256M

  wordpress:
    image: wordpress:latest
    container_name: headless-wp-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MARIADB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD:?set_MARIADB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-1}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '${WP_MEMORY_LIMIT:-256M}');
        define('WP_MAX_MEMORY_LIMIT', '${WP_MAX_MEMORY_LIMIT:-512M}');
        define('WP_ENVIRONMENT_TYPE', '${WP_ENVIRONMENT_TYPE:-development}');
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        if (!empty($$_SERVER['HTTP_HOST']) && $$_SERVER['HTTP_HOST'] === 'wordpress') { $$_SERVER['HTTPS'] = 'on'; }
        define('FORCE_SSL_ADMIN', true);
        define('WP_HOME', '${WORDPRESS_PUBLIC_URL:-http://localhost:8080}');
        define('WP_SITEURL', '${WORDPRESS_PUBLIC_URL:-http://localhost:8080}');
    volumes:
      - wp_content:/var/www/html/wp-content
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    mem_limit: 1536m

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: headless-wp-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: ${PHPMYADMIN_UPLOAD_LIMIT:-256M}
    mem_limit: 512m

  bff:
    build:
      context: ../mellorise-back
    container_name: headless-woo-bff
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_started
    ports:
      - "${BFF_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5176}
      BFF_PUBLIC_URL: ${BFF_PUBLIC_URL:-}
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:-}
      GEO_ALLOWED_COUNTRIES: ${GEO_ALLOWED_COUNTRIES:-US,BR}
      GEO_DEVELOPMENT_COUNTRY: ${GEO_DEVELOPMENT_COUNTRY:-BR}
      GEO_IP_PROVIDER_URL: ${GEO_IP_PROVIDER_URL:-https://ipwho.is/{ip}}
      GEO_IP_TIMEOUT_MS: ${GEO_IP_TIMEOUT_MS:-2500}
      GEO_CACHE_TTL_MS: ${GEO_CACHE_TTL_MS:-43200000}
      ANALYTICS_EVENTS_FILE: ${ANALYTICS_EVENTS_FILE:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      CHECKOUT_MAX_ITEM_QUANTITY: ${CHECKOUT_MAX_ITEM_QUANTITY:-12}
      CHECKOUT_PROVIDER: ${CHECKOUT_PROVIDER:-stripe}
      WOOCOMMERCE_URL: ${WOOCOMMERCE_URL:-http://wordpress}
      WOOCOMMERCE_PUBLIC_URL: ${WOOCOMMERCE_PUBLIC_URL:-http://localhost:8080}
      WOOCOMMERCE_SIGNATURE_BASE_URL: ${WOOCOMMERCE_SIGNATURE_BASE_URL:-}
      WOOCOMMERCE_CONSUMER_KEY: ${WOOCOMMERCE_CONSUMER_KEY:?set_WOOCOMMERCE_CONSUMER_KEY}
      WOOCOMMERCE_CONSUMER_SECRET: ${WOOCOMMERCE_CONSUMER_SECRET:?set_WOOCOMMERCE_CONSUMER_SECRET}
      WOOCOMMERCE_TIMEOUT_MS: ${WOOCOMMERCE_TIMEOUT_MS:-8000}
      WOOPAYMENTS_GATEWAY_ID: ${WOOPAYMENTS_GATEWAY_ID:-woocommerce_payments}
      WOOPAYMENTS_GATEWAY_TITLE: ${WOOPAYMENTS_GATEWAY_TITLE:-WooPayments}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set_STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SHIPPING_COUNTRIES: ${STRIPE_SHIPPING_COUNTRIES:-US,CA,GB,ES}
      STRIPE_SHIPPING_RATE_NAME: ${STRIPE_SHIPPING_RATE_NAME:-Standard shipping}
      STRIPE_SHIPPING_RATE_AMOUNT: ${STRIPE_SHIPPING_RATE_AMOUNT:-999}
      STRIPE_FREE_SHIPPING_RATE_NAME: ${STRIPE_FREE_SHIPPING_RATE_NAME:-Free shipping}
      STRIPE_SHIPPING_MIN_DELIVERY_DAYS: ${STRIPE_SHIPPING_MIN_DELIVERY_DAYS:-3}
      STRIPE_SHIPPING_MAX_DELIVERY_DAYS: ${STRIPE_SHIPPING_MAX_DELIVERY_DAYS:-5}
      FREE_SHIPPING_VARIATION_IDS: ${FREE_SHIPPING_VARIATION_IDS:-29,30}
      STRIPE_SHIPPING_PROTECTION_NAME: ${STRIPE_SHIPPING_PROTECTION_NAME:-Shipping protection}
      STRIPE_SHIPPING_PROTECTION_AMOUNT: ${STRIPE_SHIPPING_PROTECTION_AMOUNT:-350}
      STRIPE_AUTOMATIC_TAX_ENABLED: ${STRIPE_AUTOMATIC_TAX_ENABLED:-false}
      STRIPE_TIMEOUT_MS: ${STRIPE_TIMEOUT_MS:-10000}
      WELCOME_DISCOUNT_PERCENT: ${WELCOME_DISCOUNT_PERCENT:-10}
      WELCOME_DISCOUNT_PREFIX: ${WELCOME_DISCOUNT_PREFIX:-MELLO10}
      WELCOME_DISCOUNT_EXPIRATION_HOURS: ${WELCOME_DISCOUNT_EXPIRATION_HOURS:-48}
      WELCOME_DISCOUNT_FIRST_PURCHASE_STATUSES: ${WELCOME_DISCOUNT_FIRST_PURCHASE_STATUSES:-processing,completed}
      WELCOME_DISCOUNT_SHOP_URL: ${WELCOME_DISCOUNT_SHOP_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_WELCOME_DISCOUNT_ENABLED: ${MAIL_WELCOME_DISCOUNT_ENABLED:-true}
      MAIL_TRACKING_ENABLED: ${MAIL_TRACKING_ENABLED:-true}
      WIIO_FULFILLMENT_ENABLED: ${WIIO_FULFILLMENT_ENABLED:-false}
      WIIO_SYNC_MODE: ${WIIO_SYNC_MODE:-woocommerce}
      WIIO_API_URL: ${WIIO_API_URL:-}
      WIIO_API_KEY: ${WIIO_API_KEY:-}
      WIIO_AUTH_HEADER: ${WIIO_AUTH_HEADER:-}
      WIIO_AUTH_SCHEME: ${WIIO_AUTH_SCHEME:-Bearer}
      WIIO_WEBHOOK_SECRET: ${WIIO_WEBHOOK_SECRET:-}
      WIIO_TIMEOUT_MS: ${WIIO_TIMEOUT_MS:-10000}

volumes:
  db_data:
  wp_content:
